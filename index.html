<style>
/* ── Layout: single-column wizard, card-per-step, mobile-first ─────────── */
:root {
  --bg:        #FBF7F2;
  --surface:   #FFFFFF;
  --border:    #EAE3DA;
  --fg:        #2E2118;
  --muted:     #7A6E65;
  --coral:     #FF6B47;
  --coral-lt:  #FFF0EC;
  --teal:      #2A8C7E;
  --teal-lt:   #E6F5F3;
  --gold:      #D48A0C;
  --gold-lt:   #FEF6E4;
  --lavender:  #7B5EA7;
  --lav-lt:    #F2EDF9;
  --radius:    14px;
  --shadow:    0 2px 12px rgba(46,33,24,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #1A1410;
    --surface:  #251E18;
    --border:   #3A2F26;
    --fg:       #F0E8DF;
    --muted:    #A0958C;
    --coral:    #FF7A5A;
    --coral-lt: #2E1A14;
    --teal:     #3AADA0;
    --teal-lt:  #0F2825;
    --gold:     #E8A020;
    --gold-lt:  #28200A;
    --lavender: #9B7EC8;
    --lav-lt:   #1E1528;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:       #1A1410;
  --surface:  #251E18;
  --border:   #3A2F26;
  --fg:       #F0E8DF;
  --muted:    #A0958C;
  --coral:    #FF7A5A;
  --coral-lt: #2E1A14;
  --teal:     #3AADA0;
  --teal-lt:  #0F2825;
  --gold:     #E8A020;
  --gold-lt:  #28200A;
  --lavender: #9B7EC8;
  --lav-lt:   #1E1528;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Nunito', 'Noto Sans SC', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}

/* ── Progress bar ─────────────────────────────────────────────────────── */
.progress-wrap {
  max-width: 540px;
  margin: 0 auto 20px;
}
.progress-label {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--coral);
  border-radius: 99px;
  transition: width .4s ease;
}

/* ── Card ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px 24px;
  max-width: 540px;
  margin: 0 auto;
}
.card-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--coral);
  margin-bottom: 8px;
}
.card-title {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--fg);
  text-wrap: balance;
  margin-bottom: 4px;
  line-height: 1.25;
}
.card-subtitle {
  font-size: .88rem;
  color: var(--muted);
  margin-bottom: 22px;
}

/* ── Question options ─────────────────────────────────────────────────── */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 22px;
}
.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  transition: border-color .18s, background .18s, transform .1s;
  font-family: inherit;
  color: var(--fg);
  font-size: .95rem;
  line-height: 1.4;
}
.option-btn:hover { border-color: var(--coral); background: var(--coral-lt); }
.option-btn.selected {
  border-color: var(--coral);
  background: var(--coral-lt);
}
.option-btn .emoji {
  font-size: 1.4rem;
  flex-shrink: 0;
  margin-top: 1px;
}
.option-text-en { font-weight: 700; display: block; }
.option-text-zh { font-size: .82rem; color: var(--muted); display: block; }

/* ── Navigation ──────────────────────────────────────────────────────── */
.nav {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.btn {
  padding: 11px 22px;
  border-radius: 8px;
  font-family: inherit;
  font-size: .95rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--coral); color: #fff; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--coral); color: var(--coral); }

/* ── Results ─────────────────────────────────────────────────────────── */
.results-header {
  text-align: center;
  margin-bottom: 24px;
}
.results-header .big-emoji { font-size: 3rem; margin-bottom: 8px; }
.results-header h2 { font-size: 1.4rem; font-weight: 800; color: var(--fg); text-wrap: balance; }
.results-header p { font-size: .9rem; color: var(--muted); margin-top: 4px; }

.job-cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }

.job-card {
  border: 2px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.job-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.job-icon {
  font-size: 2rem;
  width: 48px;
  height: 48px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.job-name-en { font-weight: 800; font-size: 1.05rem; }
.job-name-zh { font-size: .85rem; color: var(--muted); }
.match-badge {
  margin-left: auto;
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 99px;
  color: #fff;
  flex-shrink: 0;
}

.job-card-body {
  padding: 0 16px 14px;
  font-size: .88rem;
  color: var(--muted);
  line-height: 1.5;
}
.job-detail-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.detail-chip {
  font-size: .78rem;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
}

/* ── Reflection box ─────────────────────────────────────────────────── */
.reflect-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
.reflect-box label {
  display: block;
  font-size: .85rem;
  font-weight: 700;
  color: var(--coral);
  margin-bottom: 6px;
  letter-spacing: .03em;
}
.reflect-box textarea, .reflect-box input[type="text"] {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font-family: inherit;
  font-size: .92rem;
  padding: 10px 12px;
  resize: vertical;
  line-height: 1.5;
}
.reflect-box textarea:focus, .reflect-box input:focus {
  outline: none;
  border-color: var(--coral);
}
.reflect-box textarea { min-height: 72px; }

/* ── Share instruction ──────────────────────────────────────────────── */
.share-note {
  background: var(--teal-lt);
  border: 1px solid var(--teal);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: .85rem;
  color: var(--fg);
  line-height: 1.55;
  margin-bottom: 16px;
}
.share-note strong { color: var(--teal); }

/* ── Intro / welcome ────────────────────────────────────────────────── */
.intro-emoji { font-size: 3.5rem; text-align: center; margin-bottom: 12px; }
.intro-title { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 6px; line-height: 1.2; }
.intro-sub { font-size: .9rem; color: var(--muted); text-align: center; margin-bottom: 24px; }
.intro-info {
  background: var(--coral-lt);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: .88rem;
  line-height: 1.6;
  margin-bottom: 22px;
}
.intro-info ul { padding-left: 18px; }
.intro-info li + li { margin-top: 4px; }
.name-input {
  width: 100%;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  font-size: 1rem;
  padding: 12px 14px;
  margin-bottom: 16px;
}
.name-input:focus { outline: none; border-color: var(--coral); }

/* ── Site header ──────────────────────────────────────────────────────── */
.site-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
}
.site-header-logo { font-size: 1.1rem; }
.site-header-title { font-weight: 700; color: var(--fg); flex: 1; }
.site-header-zh { font-weight: 400; color: var(--muted); font-size: .78rem; margin-left: 4px; }
.site-header-credit {
  font-size: .78rem;
  color: var(--muted);
  white-space: nowrap;
  padding: 3px 10px;
  background: var(--lav-lt);
  color: var(--lavender);
  border-radius: 20px;
  font-weight: 600;
  letter-spacing: .01em;
}
.site-header-credit strong { color: var(--lavender); }
</style>

<header class="site-header">
  <span class="site-header-logo">🌐</span>

// ── State ─────────────────────────────────────────────────────────────────────
let step = 'intro'; // 'intro' | 0..7 | 'results'
let studentName = '';
let answers = {}; // qId -> option index
let topJobs = [];

// ── Scoring ───────────────────────────────────────────────────────────────────
function score() {
  const traitCounts = {};
  QUESTIONS.forEach(q => {
    const ans = answers[q.id];
    if (ans == null) return;
    q.options[ans].traits.forEach(t => { traitCounts[t] = (traitCounts[t] || 0) + 1; });
  });
  const total = Object.values(traitCounts).reduce((a, b) => a + b, 0) || 1;

  const scored = JOBS.map(job => {
    let s = 0;
    job.traits.forEach(t => { s += (traitCounts[t] || 0); });
    const max = job.traits.length * 2;
    const pct = Math.round((s / max) * 100);
    return { ...job, score: s, pct: Math.min(pct, 99) };
  });

  scored.sort((a, b) => b.score - a.score);
  // Pick top 5, ensure variety by not repeating same colour (trait cluster)
  const picks = [];
  const usedColors = new Set();
  for (const j of scored) {
    if (picks.length >= 5) break;
    picks.push(j);
    usedColors.add(j.color);
  }
  topJobs = picks;
}

// ── Render ────────────────────────────────────────────────────────────────────
const app = document.getElementById('app');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const progressPct = document.getElementById('progressPct');

function updateProgress(qIdx) {
  const pct = Math.round(((qIdx + 1) / QUESTIONS.length) * 100);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `Question ${qIdx + 1} / ${QUESTIONS.length}`;
  progressPct.textContent = pct + '%';
  progressWrap.hidden = false;
}

function renderIntro() {
  progressWrap.hidden = true;
  app.innerHTML = `
    <div class="intro-emoji">🌟</div>
    <div class="intro-title">Job Explorer<br><span style="font-size:.75em;color:var(--coral)">职业探索</span></div>
    <div class="intro-sub">Find jobs that suit YOU!&nbsp; 发现适合你的职业！</div>
    <div class="intro-info">
      <ul>
        <li>⏱ Takes about <strong>10–15 minutes</strong> 大约需要 10–15 分钟</li>
        <li>📱 No internet needed after opening 打开后不需要网络</li>
        <li>🎯 You'll discover <strong>top jobs</strong> that match your interests 你将发现符合你兴趣的职业</li>
        <li>📄 Fill in your <strong>paper worksheet</strong> using your results 用测试结果填写纸质工作单，上课时上交</li>
      </ul>
    </div>
    <input type="text" class="name-input" id="nameInput" placeholder="Your name / 你的名字" maxlength="40" value="${studentName}">
    <div class="nav">
      <button class="btn btn-primary" id="startBtn" ${studentName ? '' : 'disabled'}>Start 开始 →</button>
    </div>
  `;
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  nameInput.addEventListener('input', () => {
    studentName = nameInput.value.trim();
    startBtn.disabled = !studentName;
  });
  startBtn.addEventListener('click', () => { step = 0; render(); });
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  updateProgress(idx);
  const selectedAns = answers[q.id];
  app.innerHTML = `
    <div class="card-eyebrow">Question ${idx + 1} of ${QUESTIONS.length}</div>
    <div class="card-title">${q.en}</div>
    <div class="card-subtitle">${q.zh}</div>
    <div class="options" id="opts"></div>
    <div class="nav">
      ${idx > 0 ? '<button class="btn btn-ghost" id="backBtn">← Back 上一题</button>' : ''}
      <button class="btn btn-primary" id="nextBtn" ${selectedAns != null ? '' : 'disabled'}>
        ${idx === QUESTIONS.length - 1 ? 'See results 查看结果 🎉' : 'Next 下一题 →'}
      </button>
    </div>
  `;
  const opts = document.getElementById('opts');
  const EMOJIS = ['🌟','💡','🎯','🔥'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (selectedAns === i ? ' selected' : '');
    btn.innerHTML = `
      <span class="emoji">${EMOJIS[i]}</span>
      <span><span class="option-text-en">${opt.en}</span><span class="option-text-zh">${opt.zh}</span></span>
    `;
    btn.addEventListener('click', () => {
      answers[q.id] = i;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    });
    opts.appendChild(btn);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (idx === QUESTIONS.length - 1) { score(); step = 'results'; render(); }
    else { step = idx + 1; render(); }
  });
  if (idx > 0) {
    document.getElementById('backBtn').addEventListener('click', () => { step = idx - 1; render(); });
  }
}

function matchColor(job) {
  // Return a readable match % label style
  const pct = job.pct;
  if (pct >= 70) return { bg: 'var(--teal)', label: '⭐ Great match! 非常匹配' };
  if (pct >= 45) return { bg: 'var(--gold)', label: '👍 Good match 不错的匹配' };
  return { bg: 'var(--muted)', label: '✓ Worth exploring 值得探索' };
}

function renderResults() {
  progressWrap.hidden = true;
  const jobCardsHTML = topJobs.map(job => {
    const m = matchColor(job);
    return `
      <div class="job-card">
        <div class="job-card-header" style="background:${job.color}18;border-bottom:1px solid ${job.color}30">
          <div class="job-icon" style="background:${job.color}22">${job.emoji}</div>
          <div>
            <div class="job-name-en" style="color:${job.color}">${job.en}</div>
            <div class="job-name-zh">${job.zh}</div>
          </div>
          <div class="match-badge" style="background:${m.bg}">${m.label}</div>
        </div>
        <div class="job-card-body">
          <p>${job.descEn}</p>
          <p style="margin-top:4px;font-size:.82rem">${job.descZh}</p>
          <div class="job-detail-row">
            <span style="font-size:.78rem;color:var(--muted);align-self:center">Key skills:</span>
            ${job.skills.map(s => `<span class="detail-chip">${s}</span>`).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="results-header">
      <div class="big-emoji">🎉</div>
      <h2>Here are your top jobs, ${studentName}!<br><span style="color:var(--coral)">这些职业很适合你！</span></h2>
      <p>Based on your answers · 根据你的答案</p>
    </div>

    <div class="job-cards">${jobCardsHTML}</div>

    <div class="share-note">
      <strong>📄 How to submit / 如何上交作业：</strong><br>
      Write your top job results and your answers on the <strong>paper worksheet</strong> your teacher gave you, and hand it in during class.<br>
      把你的职业测试结果和答案填写在老师发给你的<strong>纸质工作单</strong>上，课堂上交给老师。
    </div>

    <div class="nav" style="justify-content:space-between">
      <button class="btn btn-ghost" id="retryBtn">← Redo quiz 重新测试</button>
    </div>
    <p style="text-align:center;font-size:.75rem;color:var(--border);margin-top:20px;letter-spacing:.04em">✦ Designed by Lavinder · Job Explorer · 30 careers ✦</p>
  `;

  document.getElementById('retryBtn').addEventListener('click', () => {
    answers = {}; step = 0; render();
  });
}

function render() {
  if (step === 'intro') renderIntro();
  else if (step === 'results') renderResults();
  else renderQuestion(step);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Boot — restore name from localStorage if available

  const saved = JSON.parse(localStorage.getItem('jr_state') || '{}');
  if (saved.name) studentName = saved.name;
} catch(e){}

render();

// Auto-save name
document.addEventListener('input', e => {
  if (e.target.id === 'nameInput') {
    try { localStorage.setItem('jr_state', JSON.stringify({ name: e.target.value })); } catch(e2){}
  }
});
